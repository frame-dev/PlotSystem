name: PlotSystem
version: '${project.version}'
main: ch.framedev.plotsystem.main.Main
description: Claim your own Blocks only for you, you can add Players to help you Build
api-version: '1.13'
authors: [ FrameDev ]
website: https://framedev.ch
softdepend:
  - Vault

commands:
  create:
  pos1:
  pos2:
  plot:
    aliases:
      - p
      - plots
  createplot:
  claim:
  pmarker:
    description: Gives you the Marker for selecting your two Locations
  plotsystem:

permissions:
  plotsystem.*:
    children:
      plotsystem.admin.break: true
      plotsystem.admin.place: true
      plotsystem.admin.pvp: true
      plotsystem.admin.interact: true
      plotsystem.admin.ignore: true
      plotsystem.admin.ignorechat: true
      plotsystem.admin.ignorecommands: true
      plotsystem.admin.itemdrop: true
      plotsystem.admin.itempickup: true
      plotsystem.admin.hunger: true
      plotsystem.admin.enderpearl: true
      plotsystem.admin.doors: true
      plotsystem.admin.switches: true
      plotsystem.admin.vehicles: true
      plotsystem.admin.armorstands: true
      plotsystem.admin.itemframes: true
      plotsystem.admin.projectiles: true
      plotsystem.admin.fly: true
      plotsystem.admin.gamemode: true
      plotsystem.admin.create: true
      plotsystem.admin.createplot: true
      plotsystem.admin.delete: true
      plotsystem.flags.info: true
      plotsystem.plot.marker: true
      plotsystem.plot.claim: true
      plotsystem.plot.unclaim: true
      plotsystem.plot.buy: true
      plotsystem.plot.home: true
      plotsystem.plot.sethome: true
      plotsystem.plot.setprice: true
      plotsystem.plot.list: true
      plotsystem.plot.list.others: true
      plotsystem.plot.stats: true
      plotsystem.plot.visit: true
      plotsystem.plot.ban: true
      plotsystem.plot.flag: true
      plotsystem.plot.removeowner: true
      plotsystem.plot.setowner: true
      plotsystem.plot.removemember: true
      plotsystem.plot.addmember: true
      plotsystem.plot.info: true
      plotsystem.help: true
